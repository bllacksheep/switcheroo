# treat every name list an alias by default
switcheroo:
  configs: "~/.local/share/switcheroo"
  gitconfig:
    - name: work
      account: "${WORK_ACCOUNT}"
      email: "${WORK_EMAIL}"
      signingkey: "${WORK_SIGNINGKEY}"
      credentials:
        - name: "https://github.com"
          helper: "!/opt/homebrew/bin/gh auth git-credential"
        - name: "https://gits.github.com"
          helper: "!/opt/homebrew/bin/gh auth git-credential"
    - name: personal
      acount: bllacksheep
      email: "${PERSONAL_EMAIL}"
      credentials:
        - name: "https://github.com"
          helper: "!/opt/homebrew/bin/gh auth git-credential"
        - name: "https://gits.github.com"
          helper: "!/opt/homebrew/bin/gh auth git-credential"
      default: true
