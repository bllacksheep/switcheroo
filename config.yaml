switcheroo:
  gitconfig:
    - alias: work
      account: "${WORK_ACCOUNT}"
      name: "${WORK_NAME}"
      email: "${WORK_EMAIL}"
      signingkey: "${WORK_SIGNINGKEY}"
      credentials:
        - name: "https://github.com"
          helper: "!/opt/homebrew/bin/gh auth git-credential"
        - name: "https://gits.github.com"
          helper: "!/opt/homebrew/bin/gh auth git-credential"
    - name: personal
      acount: bllacksheep
      name: bllacksheep
      email: "${PERSONAL_EMAIL}"
      credentials:
        - name: "https://github.com"
          helper: "!/opt/homebrew/bin/gh auth git-credential"
        - name: "https://gits.github.com"
          helper: "!/opt/homebrew/bin/gh auth git-credential"
      default: true
